<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Two Column Layout</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
</head>
<body class="bg-light">

    <div class="container mt-5">

        <div class="row">

            <div class="col-3">
                <div class="bg-primary p-4">
                    <p class="text-warning display-4 text-center">BOX 1</p>
                </div>
            </div>

            <div class="col-3">
                <div class="bg-warning p-4">
                    <p class="text-danger display-4 text-center">BOX 2</p>
                </div>
            </div>

            <div class="col-3">
                <div class="bg-danger p-4">
                    <p class="text-warning display-4 text-center">BOX 3</p>
                </div>
            </div>

            <div class="col-3">
                <div class="bg-info-subtle p-4">
                    <p class="text-danger display-4 text-center">BOX 4</p>
                </div>
            </div>

        </div>

    </div>
</body>
</html>
