<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home-Media showcase</title>
</head>
<center><body>
    <header>
        <div>
            <h1>Welcome to our MediaShow</h1>
        </div>
    </header>
    <section>
        <div>
            <h2>Gallery</h2>
            <img src="assets/image/1.jpeg" alt="Paul Walker"width="550" height="400">
            <img src="assets/image/2.jpeg" alt="Nissan GTR" width="550" height="400"> 
            <img src="assets/image/3.jpeg" alt="Night Rider">
        </div>
    </section>
    <hr>

    <section>
        <div>
            <h2>Audio</h2>
            <audio controls autoplay muted> 
               <source src="assets/audio/2.mpeg" type="audio/mpeg">
            </audio>
        </div>
    </section>
    <hr>

    <section>
        <div>
            <h2>video</h2>
            <video controls width="1000" height="500" poster="assets/image/banner/1.jpeg">
                <source src="../assets/video/1.mp4" type="video/mp4">
            </video>
            <br><br>
        </div>
    </section>
    <hr>

    <section>
        <div>
            <h2>YouTube Video</h2>
           <iframe width="560" height="315" src="https://www.youtube.com/embed/47tYp5Af8Ok?si=WSsc_AIdXRqGyK9m" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </section>

    <section>
        <div>
            <h2>Google Map</h2>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3886.963517497759!2d80.20188717447404!3d13.037994213420394!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a526752db8ffe35%3A0x7f6a2a2d0ebbdc94!2sSoftlogic!5e0!3m2!1sen!2sin!4v1784830492951!5m2!1sen!2sin" width="600" height="330" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
    </section>
    <hr>

    <section>
        <div>
            <h2>Document</h2>
            <iframe src="assets/pdf/1.pdf" frameborder="0" width="600" height="600"></iframe>
        </div>
    </section>
    
</body></center>
</html>
