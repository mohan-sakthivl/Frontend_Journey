<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>
    <center>
    <h2>Job Application Form</h2>
    <form action="#">

        <label for="full name">Full Name:</label>
        <input type="text" id="full name" name="full name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="Phone Number">Phone Number:</label>
        <input type="tel" id="Phone Number" name="Phone Number" maxlength="10" required><br><br>

        <label for="Position for Applying Job">Position for Applying Job:</label>
        <select name="Position for Applying Job" id="Position for Applying Job" required>
            <option value="">select</option>
            <option value="Frontend Developer">Frontend Developer</option>
            <option value="Backend Developer">Backend Developer</option> 
            <option value="FullStack Developer">FullStack Developer</option>
        </select><br><br>

        <label for="Experience">Experience:</label>
        <input type="number" name="Experience" id="Experience" min="2" max="5" required><br><br>

        <label for="Upload Resume">Upload Resume:</label>
        <input type="file" name="Upload Resume" id="Upload Resume" accept=".pdf,.doc,.docx"><br><br>

        <label for="Cover Letter">Cover Letter:</label>
        <textarea name="Cover Letter" id="Cover Letter" cols="40" rows="6"></textarea><br><br>

        <button type="submit">Apply</button>
        <button type="reset">Reset</button>

    </form></center>
</body>
</html>
