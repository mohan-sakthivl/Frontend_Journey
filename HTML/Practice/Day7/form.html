<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Page</title>
</head>
<body>
    <section>
        <div>
            <form action="post">

                <label for="username">Enter the Username:</label>
                <input type="text" id="username"><br><br>

                <label for="useremail">Enter the Email:</label>
                <input type="email" id="useremail"><br><br>

                <label for="userpassword">Enter the Password:</label>
                <input type="password" id="useremail"><br><br>

                <label for="usergender">Gender :</label>
                <input type="radio" name="gender" id="usergender"> male
                <input type="radio" name="gender" id="usergender"> female
                <input type="radio" name="gender" id="usergender"> others
                <br><br>

                <label for="userskills">Skills</label>
                <input type="checkbox" name="userskills" id="userskills"> Html
                <input type="checkbox" name="userskills" id="userskills"> css
                <input type="checkbox" name="userskills" id="userskills"> java
                <br><br>

                <label for="course">Course</label>
                <select name="course" id="course">
                    <option value="">select one...</option>
                    <option value="1">frontend</option>
                    <option value="2">backend</option>
                    <option value="3">fullstack</option>
                    <option value="4">testing</option>
                </select>
                <br><br>

                <input type="submit" name="submit">


            </form>
        </div>
    </section>
    
</body>
</html>
