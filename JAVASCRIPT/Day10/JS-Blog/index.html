<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS MasterHub | 10 Core Topics + 10 Logical Programming Challenges</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"Fira Code"', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-[#0b0f19] dark:text-gray-100 min-h-screen flex flex-col antialiased transition-colors duration-200">

  <!-- ========================================================================= -->
  <!-- TOP NAVIGATION NAVBAR -->
  <!-- ========================================================================= -->
  <header class="sticky top-0 z-40 w-full border-b border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-[#0b0f19]/80 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      
      <!-- Brand & Mobile Toggle -->
      <div class="flex items-center gap-3">
        <button id="mobile-menu-toggle" class="lg:hidden p-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 focus:outline-none" aria-label="Toggle Sidebar">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>

        <a href="#" class="flex items-center gap-2.5 group">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-400 to-amber-500 flex items-center justify-center text-gray-900 font-extrabold text-lg shadow-md shadow-amber-500/20 group-hover:scale-105 transition-transform">
            JS
          </div>
          <div>
            <div class="font-extrabold text-base tracking-tight leading-tight flex items-center gap-1.5">
              <span>MasterHub</span>
              <span class="text-[10px] uppercase font-bold tracking-widest px-1.5 py-0.5 rounded bg-blue-100 dark:bg-blue-900/60 text-blue-700 dark:text-blue-300">v2026</span>
            </div>
            <p class="text-[11px] text-gray-500 dark:text-gray-400">10 Topics + 10 Logical Problems</p>
          </div>
        </a>
      </div>

      <!-- Quick Search Bar -->
      <div class="hidden sm:flex flex-1 max-w-md mx-4">
        <div class="relative w-full">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          </div>
          <input 
            type="text" 
            id="search-input" 
            placeholder="Search topics (e.g. Array, Closure, Prime, Sort)..." 
            class="w-full pl-9 pr-4 py-2 text-sm bg-gray-100 dark:bg-gray-800/80 border border-transparent focus:border-blue-500 dark:focus:border-blue-500 rounded-xl focus:bg-white dark:focus:bg-gray-900 focus:outline-none transition-all placeholder-gray-400"
          />
        </div>
      </div>

      <!-- Actions (Progress & Theme Switch) -->
      <div class="flex items-center gap-3">
        <!-- Dark / Light Theme Toggle -->
        <button id="theme-toggle" class="p-2.5 rounded-xl border border-gray-200 dark:border-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" title="Toggle Theme">
          <span class="dark:hidden">🌙</span>
          <span class="hidden dark:inline">☀️</span>
        </button>
      </div>

    </div>
  </header>

  <!-- ========================================================================= -->
  <!-- MAIN CONTAINER WITH SIDEBAR & CONTENT -->
  <!-- ========================================================================= -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-8 py-6">
    
    <!-- LEFT SIDEBAR -->
    <aside id="main-sidebar" class="fixed inset-y-0 left-0 z-30 w-72 lg:w-auto lg:static lg:block lg:col-span-4 xl:col-span-3 bg-white dark:bg-[#0f1422] lg:bg-transparent lg:dark:bg-transparent p-4 lg:p-0 border-r lg:border-none border-gray-200 dark:border-gray-800 shadow-2xl lg:shadow-none transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-in-out overflow-y-auto max-h-screen lg:max-h-[calc(100vh-6rem)] sticky top-20">
      
      <!-- Learning Progress Meter -->
      <div class="p-4 rounded-2xl bg-gradient-to-br from-blue-50 to-indigo-50 dark:from-gray-800/60 dark:to-gray-800/30 border border-blue-100 dark:border-gray-700/60 mb-5">
        <div class="flex items-center justify-between text-xs font-bold text-gray-700 dark:text-gray-300 mb-1.5">
          <span>🎓 Learning Progress</span>
          <span id="overall-progress-text" class="text-blue-600 dark:text-blue-400 font-mono">0/20</span>
        </div>
        <div class="w-full h-2.5 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
          <div id="overall-progress-bar" class="h-full bg-gradient-to-r from-blue-500 to-indigo-600 rounded-full transition-all duration-300" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Filter Tabs -->
      <div class="flex p-1 bg-gray-100 dark:bg-gray-800/80 rounded-xl mb-4 text-xs font-semibold">
        <button class="filter-pill flex-1 py-1.5 rounded-lg bg-blue-600 text-white shadow-sm transition-all" data-filter="all">
          All (<span id="count-all">20</span>)
        </button>
        <button class="filter-pill flex-1 py-1.5 rounded-lg text-gray-700 dark:text-gray-300 hover:text-blue-600 transition-all" data-filter="core">
          Core (<span id="count-core">10</span>)
        </button>
        <button class="filter-pill flex-1 py-1.5 rounded-lg text-gray-700 dark:text-gray-300 hover:text-blue-600 transition-all" data-filter="logical">
          Logic (<span id="count-logical">10</span>)
        </button>
      </div>

      <!-- Navigation Accordion -->
      <div class="space-y-6">
        <!-- Section 1: Core Topics -->
        <div>
          <div class="flex items-center justify-between text-xs font-extrabold uppercase tracking-wider text-gray-400 dark:text-gray-500 px-3 mb-2">
            <span>📘 10 Core Concepts</span>
            <span class="text-[10px] bg-blue-100 dark:bg-blue-950 text-blue-700 dark:text-blue-300 px-1.5 py-0.5 rounded font-mono">Theory + Code</span>
          </div>
          <ul id="core-topics-list" class="space-y-1"></ul>
        </div>

        <!-- Section 2: Logical Challenges -->
        <div>
          <div class="flex items-center justify-between text-xs font-extrabold uppercase tracking-wider text-gray-400 dark:text-gray-500 px-3 mb-2">
            <span>🧠 10 Logical Problems</span>
            <span class="text-[10px] bg-purple-100 dark:bg-purple-950 text-purple-700 dark:text-purple-300 px-1.5 py-0.5 rounded font-mono">Algorithms</span>
          </div>
          <ul id="logical-topics-list" class="space-y-1"></ul>
        </div>
      </div>
    </aside>

    <!-- RIGHT / MAIN CONTENT AREA -->
    <main class="lg:col-span-8 xl:col-span-9">
      <div id="main-content-area" class="p-6 sm:p-8 rounded-3xl bg-white dark:bg-[#111827] border border-gray-200 dark:border-gray-800 shadow-sm transition-all">
        <!-- Dynamic topic rendered here by app.js -->
        <div class="flex items-center justify-center py-20 text-gray-400">
          <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
        </div>
      </div>
    </main>

  </div>

  <!-- ========================================================================= -->
  <!-- FOOTER -->
  <!-- ========================================================================= -->
  <footer class="mt-auto border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-[#0b0f19] py-8 text-center text-xs text-gray-500 dark:text-gray-400">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="font-bold text-gray-800 dark:text-gray-200">JavaScript Learning Hub</span>
      </div>
      <div class="flex items-center gap-4 text-xs font-medium">
        <span class="text-emerald-600 dark:text-emerald-400 font-semibold">10 Core Topics</span>
        <span>+</span>
        <span class="text-purple-600 dark:text-purple-400 font-semibold">10 Logical Challenges</span>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/runner.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
