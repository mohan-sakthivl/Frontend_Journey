<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position Comparison</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="box static">
        Static Position
    </div>

    <div class="box relative">
        Relative Position
    </div>

    <div class="parent">
        <div class="box absolute">
            Absolute Position
        </div>
    </div>

    <div class="box sticky">
        Sticky Position
    </div>

    <div class="content">
        <p>Scroll down to see the Sticky and Fixed boxes in action.</p>
    </div>

    <div class="box fixed">
        Fixed Position
    </div>

</body>
</html>
