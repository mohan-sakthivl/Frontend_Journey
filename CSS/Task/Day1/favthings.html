<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Favorite Things </title>
    <style>
        .place{
            background-color: lightpink;
            color: black;
            width: 300px;
            height: 100px;
            text-align: center;
            margin: auto;
        }

        .actor{
            background-color: lightgoldenrodyellow;
            color: black;
            width: 300px;
            height: 100px;
            text-align: center;
            margin: auto;
        }

        .sport{
            background-color: lightgray;
            color: black;
            width: 300px;
            height: 100px;
            text-align: center;
            margin: auto;
        }
    </style>
</head>
<body>
    <header>
        <h2 style="text-align: center;  font-size: xx-large; font-weight: bold;"> FAVORITE THINGS </h2>
    </header>
    <main>
        <div style="background-color: lightgreen; margin: auto; color: black; width: 300px; height: 100px; text-align: center;">
            <h2>Favorite Food</h2>
            <p>Chicken Biryani</p>
        </div>

        <div style="background-color: lightblue; color: black; width: 300px; height: 100px; margin: auto; text-align: center;">
            <h2>Favorite Movie</h2>
            <p>Sanam Teri Kasam</p>
        </div>

        <div class="place">
            <h2>Favorite Place</h2>
            <p>Chennai</p>
        </div>

        <div class="actor">
            <h2>Favorite Actor</h2>
            <p>Silambarasan</p>
        </div>

        <div class="sport">
            <h2>Favorite Sport</h2>
            <p>Badminton</p>
        </div>
    </main>
    
</body>
</html>
