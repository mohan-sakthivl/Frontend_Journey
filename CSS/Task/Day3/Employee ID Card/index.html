<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee ID Card</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="main">
        <div>
            <img class="logo" src="https://logos-world.net/wp-content/uploads/2020/04/Amazon-Logo.png" alt="logo_amazon">
            <img class="pfp" src="https://img.freepik.com/premium-photo/photo-young-smart-indian-businessman-smiling-face-standing-blur-background_843741-1860.jpg" alt="profile_picture">
        </div>
        <div>
            <h2>Mohan S</h2>
            <p>Full Stack Developer</p>
            <p>ID : 0FE_060726</p>
            <p>Blood Group : O+</p>
        </div>
        <div>
            <img class="bc" src="assets/images/barcode-Code128C.png" alt="barcode">
            <img class="sign" src="assets/images/sign.png" alt="sign">
            <p id="asign">Authorized signature</p>
        </div>
    </div>
</body>
</html>
