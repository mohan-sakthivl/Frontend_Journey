<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Order</title>
    <link rel="shortcut icon" href="../images/logo/logo1.jpeg" type="image/x-icon">
    <link rel="stylesheet" href="../css/style.css">
</head>
<center><body>
    <table>
        <form action="post">

            <h2>Custom Order</h2>
            <label for="Customer Name">Customer Name : </label>
            <input type="text"  id="Customer Name" placeholder="Enter your Name" required><br><br>

            <label for="Mobile Number">Mobile Number : </label>
            <input type="tel" id="Mobile Number" placeholder="Enter the Number" minlength="10" maxlength="10" required><br><br>
       
            <label for="Email">Email Id : </label>
            <input type="text" id="Email" placeholder="Enter the Email Id" required><br><br>

            <label for="product">Product : </label>
            <select id="product">
                <option value="">select one...</option>
                <option value="1">Mini bouquet</option>
                <option value="2">Polarid</option>
                <option value="3">Flower bouquet</option>
                <option value="4">Keychain</option>
            </select><br><br>

            <label for="gift">Describe about the customized gift : </label>
            <textarea id="gift"></textarea><br><br>
            
            <input type="submit" value="Submit">
           
            
            
       
       
       
        </form>
    </table>
    
</body></center>
</html>
